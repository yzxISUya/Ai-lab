[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snake-rl"
version = "0.1.0"
description = "A progressive reinforcement learning playground: learning Snake with DQN and beyond"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pygame>=2.5",
    # 训练也需要，直接放进主依赖：`uv sync` 一次装齐。
    "torch>=2.6",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# 全棋盘 CNN 需要 CUDA。torch 从 PyTorch 官方 cu130 索引安装
# （RTX 5060 / Blackwell，驱动 CUDA 13.3；约 2.5GB）。
# 如果只是跑 11 维 MLP、想回到 CPU：把索引换成
# https://download.pytorch.org/whl/cpu，再 `uv lock && uv sync`。
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.setuptools.packages.find]
include = ["snake_rl*"]
exclude = ["tests*", "scripts*", "teach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
